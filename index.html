<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Student Grade Tracker</title>
</head>
<body>
    <div class="form-row">
        <input type="text" id="student-id" name="student-id" placeholder="Please enter your ID">
        <input type="text" id="student-name" name="student-name" placeholder="Please enter your name">
        <input type="text" id="student-class" name="student-class" placeholder="Please enter your class">
        <input type="text" id="student-grade" name="student-grade" placeholder="Please enter your grade">
        <button id="add-btn">Add</button>
        <button id="clear-btn">Clear All</button>
    </div>
    <input type="text" id="search-input" placeholder="Search by name">
    <p id="average-grade"></p>
    <button id="sort-btn">Sort by grade</button>
    <table>
        <thead>
            <tr>
                <th>Student ID:</th>
                <th>Name:</th>
                <th>Class:</th>
                <th>Grade</th>                
            </tr>
        </thead>
        <tbody id="student-list"></tbody>
    </table>
    <script src="index.js"></script>
</body>
</html>
